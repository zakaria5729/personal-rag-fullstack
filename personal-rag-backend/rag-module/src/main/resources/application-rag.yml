lang-chain4j:
  chat-model:
    base-url: http://localhost:11434
    name: phi4-mini:latest
    predictivity-level: 0.6
  streaming-chat-model:
    base-url: http://localhost:11434
    name: phi4-mini:latest
    predictivity-level: 0.6
  embedding-model:
    base-url: http://localhost:11434
    name: nomic-embed-text:137m-v1.5-fp16

reranker:
  models-base-path: /Users/zakaria/Data/rag-models/reranker/

sentence-split:
  model-path: /Users/zakaria/Data/rag-models/sentence-split/opennlp-en-ud-ewt-sentence-1.3-2.5.4.bin

vector-store:
  max-chunk-size: 1000
  normalize-vector: true
  extract-metadata: true
  case-insensitive: false
  apply-reranking: true
  query-result-limit: 20
  rerank-result-limit: 10
  similarity-threshold: 0.7
  rerank-score-threshold: -3.0
  # Reranker scores: higher = more relevant. Tune based on your reranker model output range.

rag-module:
  enabled: true
  sse-timeout-minute: 3
  split-user-query: false
  invalid-query-msg: I don't have enough information to answer this question.

logging:
  level:
    org.springframework.jdbc.core: debug